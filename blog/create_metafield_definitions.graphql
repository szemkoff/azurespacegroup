  type: "boolean"
  description: "True if rotor is floating style."
  ownerType: PRODUCT
  visibleToStorefrontApi: true
}) {
  createdDefinition { id name namespace key ownerType type }
  userErrors { field message }
}
  metafieldDefinitionCreate(input: {
  name: "Min Thickness (mm)"
  namespace: "tech"
  key: "min_thickness_mm"
  type: "number_decimal"
  description: "Minimum service thickness per approval sheet."
  ownerType: PRODUCT
  visibleToStorefrontApi: true
}) {
  createdDefinition { id name namespace key ownerType type }
  userErrors { field message }
}
  metafieldDefinitionCreate(input: {
  name: "GTÜ Approval URL"
  namespace: "docs"
  key: "gtu_url"
  type: "url"
  description: "Link to GTÜ approval PDF."
  ownerType: PRODUCT
  visibleToStorefrontApi: true
}) {
  createdDefinition { id name namespace key ownerType type }
  userErrors { field message }
}
  metafieldDefinitionCreate(input: {
  name: "Install Guide URL"
  namespace: "docs"
  key: "install_url"
  type: "url"
  description: "Link to installation PDF or video."
  ownerType: PRODUCT
  visibleToStorefrontApi: true
}) {
  createdDefinition { id name namespace key ownerType type }
  userErrors { field message }
}
  metafieldDefinitionCreate(input: {
  name: "Is Kit"
  namespace: "specs"
  key: "is_kit"
  type: "boolean"
  description: "True for Rotor + Adapter kit variants; false for Rotor Only."
  ownerType: PRODUCT_VARIANT
  visibleToStorefrontApi: true
}) {
  createdDefinition { id name namespace key ownerType type }
  userErrors { field message }
}
  metafieldDefinitionCreate(input: {
  name: "Kit Components (JSON)"
  namespace: "specs"
  key: "kit_components"
  type: "single_line_text_field"
